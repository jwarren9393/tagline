name: tagline
description: "Expert pre-production tool for Suno AI"
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  google_fonts: ^9.0.0
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.1
  file_picker: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/tagline_icon.png
  adaptive_icon_background: "#12161A"
  adaptive_icon_foreground: assets/branding/tagline_icon.png
  windows:
    generate: true
    image_path: assets/branding/tagline_icon.png
    icon_size: 256
  linux:
    generate: true
    image_path: assets/branding/tagline_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
